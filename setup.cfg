[tool:pytest]
addopts = -q
testpaths = tests
markers =
    e2e: End-to-end tests with full CLI and real data
    slow: Tests that take > 5 seconds to run

[flake8]
max-line-length = 100
ignore = E203,W503

[mypy]
python_version = 3.9
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
ignore_missing_imports = True
